<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Alcaldía de Galapa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #eef3f7;
            color: #1f2937;
        }

        .contenedor {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .icono {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .boton:hover {
            background: #1d4ed8;
        }

        .ayuda {
            margin-top: 18px;
            font-size: 13px;
            color: #9ca3af;
        }

        .cargando {
            width: 42px;
            height: 42px;
            margin: 0 auto 18px;
            border: 4px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: girar 0.9s linear infinite;
        }

        @keyframes girar {
            to { transform: rotate(360deg); }
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>
    <main class="contenedor" aria-live="polite">
        <div class="cargando" aria-hidden="true"></div>
        <h1>Abriendo el formulario</h1>
        <p id="mensaje">Estamos preparando el formulario. Si no se abre automáticamente, pulsa el botón.</p>
        <a class="boton" id="boton" href="https://script.google.com/macros/s/AKfycbweAXK6QDYUU-f9lfFf8KVNLs4ZK6vEx652AQMyrVQwQ2g9Vya5bwDHx-tqIY6_JKFN/exec">Continuar</a>
        <p class="ayuda" id="ayuda">La página permanecerá visible mientras se realiza la apertura.</p>
    </main>

    <script>
        const url = "https://script.google.com/macros/s/AKfycbweAXK6QDYUU-f9lfFf8KVNLs4ZK6vEx652AQMyrVQwQ2g9Vya5bwDHx-tqIY6_JKFN/exec";
        const agente = navigator.userAgent || "";
        const esMovil = /Android|iPhone|iPad|iPod|Mobile/i.test(agente);
        const esNavegadorIntegrado = /FBAN|FBAV|Instagram| Messenger/i.test(agente);
        const mensaje = document.querySelector("#mensaje");
        const ayuda = document.querySelector("#ayuda");

        const boton = document.querySelector("#boton");
        const paginaActual = window.location.href.split("#")[0];

        boton.href = url;

        if (esMovil && esNavegadorIntegrado) {
            mensaje.textContent = "Abriendo el navegador de tu teléfono para mostrar el formulario.";
            ayuda.textContent = "Si no se abre, pulsa Continuar.";
            boton.textContent = "Abrir navegador";

            if (/Android/i.test(agente)) {
                const paginaSinProtocolo = paginaActual.replace(/^https?:\/\//, "");
                boton.href = "intent://" + paginaSinProtocolo + "#Intent;scheme=https;package=com.android.chrome;end";
                window.location.href = boton.href;
            } else {
                boton.href = paginaActual;
                window.open(paginaActual, "_blank");
            }
        } else {
            boton.textContent = "Abrir formulario";
            setTimeout(() => {
                window.location.href = url;
            }, 700);
        }
    </script>

</body>
</html>
