<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Alcaldía de Galapa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #eef3f7;
            color: #1f2937;
        }

        .contenedor {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            width: auto;
            padding: 14px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .boton:hover {
            background: #1d4ed8;
        }

        .ayuda {
            margin-top: 18px;
            font-size: 13px;
            color: #9ca3af;
        }

        .formulario {
            width: 100%;
            max-width: 900px;
            height: 75vh;
            min-height: 560px;
            margin: 20px auto 0;
            border: 1px solid #dbe3ea;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 600px) {
            .contenedor {
                padding: 16px 10px;
            }

            .formulario {
                height: 78vh;
                min-height: 500px;
                margin-top: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="contenedor" aria-live="polite">
        <div class="formulario">
            <iframe
                src="https://script.google.com/macros/s/AKfycbweAXK6QDYUU-f9lfFf8KVNLs4ZK6vEx652AQMyrVQwQ2g9Vya5bwDHx-tqIY6_JKFN/exec"
                title="Formulario Alcaldía de Galapa"
                allow="clipboard-write">
            </iframe>
        </div>
        <p class="ayuda">Si el formulario no carga dentro de Facebook, ábrelo directamente:</p>
        <a class="boton" href="https://script.google.com/macros/s/AKfycbweAXK6QDYUU-f9lfFf8KVNLs4ZK6vEx652AQMyrVQwQ2g9Vya5bwDHx-tqIY6_JKFN/exec" target="_blank" rel="noopener noreferrer">Abrir formulario</a>
    </main>
</body>
</html>
